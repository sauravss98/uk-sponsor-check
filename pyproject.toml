[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sponsor-check"
version = "0.1.0"
description = "Check UK employers against the Home Office register of licensed visa sponsors, from Claude or the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saurav Suresh" }]
dependencies = [
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "sponsor-check[api]"]

[project.scripts]
sponsor-check = "sponsor_check.cli:main"
sponsor-check-mcp = "sponsor_check.server:main"
sponsor-check-api = "sponsor_check.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sponsor_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in argument defaults is the framework's own dependency-injection
# idiom, not the mutable-default-argument bug B008 exists to catch.
"src/sponsor_check/api.py" = ["B008"]
